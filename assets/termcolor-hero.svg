<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">termcolor styled text primitives</title>
  <desc id="desc">A Catppuccin terminal showing text attributes, semantic colors, composition, and target-aware rendering.</desc>
  <rect width="1200" height="560" rx="20" fill="#1e1e2e"/>
  <rect width="1200" height="58" rx="20" fill="#292b3b"/>
  <rect y="38" width="1200" height="20" fill="#292b3b"/>
  <circle cx="32" cy="29" r="8" fill="#f38ba8"/><circle cx="58" cy="29" r="8" fill="#f9e2af"/><circle cx="84" cy="29" r="8" fill="#a6e3a1"/>
  <text x="116" y="36" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700">termcolor · pure styled text</text>
  <text x="48" y="100" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="28" font-weight="700">One Text value · every terminal</text>
  <text x="48" y="132" fill="#a6adc8" font-family="SFMono-Regular,Menlo,monospace" font-size="17">styles stay pure data until an explicit RenderTarget emits them</text>
  <rect x="40" y="158" width="1120" height="350" rx="16" fill="#181825" stroke="#45475a" stroke-width="2"/>
  <text x="70" y="201" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">ATTRIBUTES</text>
  <text x="70" y="238" fill="#a6adc8" font-family="SFMono-Regular,Menlo,monospace" font-size="22">bold</text>
  <text x="165" y="238" fill="#a6adc8" font-family="SFMono-Regular,Menlo,monospace" font-size="22" font-style="italic">italic</text>
  <text x="274" y="238" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="22" text-decoration="underline">underline</text>
  <text x="432" y="238" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="22" text-decoration="line-through">strike</text>
  <text x="552" y="238" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700">reverse</text>
  <rect x="663" y="215" width="108" height="30" rx="5" fill="#cdd6f4"/><text x="677" y="238" fill="#1e1e2e" font-family="SFMono-Regular,Menlo,monospace" font-size="20">framed</text>
  <text x="70" y="282" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">SEMANTIC COLORS</text>
  <text x="70" y="320" fill="#f38ba8" font-family="SFMono-Regular,Menlo,monospace" font-size="22">error</text>
  <text x="170" y="320" fill="#f9e2af" font-family="SFMono-Regular,Menlo,monospace" font-size="22">warning</text>
  <text x="306" y="320" fill="#a6e3a1" font-family="SFMono-Regular,Menlo,monospace" font-size="22">success</text>
  <text x="442" y="320" fill="#89b4fa" font-family="SFMono-Regular,Menlo,monospace" font-size="22">info</text>
  <text x="540" y="320" fill="#94e2d5" font-family="SFMono-Regular,Menlo,monospace" font-size="22">source</text>
  <text x="70" y="364" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">COMPOSITION</text>
  <text x="70" y="404" fill="#a6e3a1" font-family="SFMono-Regular,Menlo,monospace" font-size="23" font-weight="700">ready</text>
  <text x="165" y="404" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="23"> · </text>
  <text x="205" y="404" fill="#f9e2af" font-family="SFMono-Regular,Menlo,monospace" font-size="23">disk almost full</text>
  <text x="70" y="456" fill="#6c7086" font-family="SFMono-Regular,Menlo,monospace" font-size="17">plain</text>
  <text x="165" y="456" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="17">visible text preserved</text>
  <text x="480" y="456" fill="#6c7086" font-family="SFMono-Regular,Menlo,monospace" font-size="17">target</text>
  <text x="575" y="456" fill="#94e2d5" font-family="SFMono-Regular,Menlo,monospace" font-size="17">true color · ANSI · OSC-8</text>
</svg>
